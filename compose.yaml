name: shahmat
services:
  svc:
    build: { context: ., dockerfile: Dockerfile }
    image: ${IMAGE:-shahmat-svc:local}
    # CLI-only v1: run-to-completion (exits 0). Ports, healthcheck, env,
    # logging caps, and resource limits return with the Phase-5 server.
    user: "65532:65532"
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    restart: "no"

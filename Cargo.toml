[package]
name = "shahmat"
version = "0.1.0"
edition = "2021"
description = "Movegen-correct chess lib, fastest plus least-memory per platform"
license = "Apache-2.0"

[[bin]]
name = "shahmat-svc"
path = "src/main.rs"

[features]
default = ["magic-black"]
magic-black = []
min-mem = []
pext = []

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = "debuginfo"

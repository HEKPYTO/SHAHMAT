# SHAHMAT CI — Phase 3 trusted gates.
#
# gate: native single-arch build+test+perft, runs on PRs, branch pushes, and
# tags. Docker image build + in-image smoke + size gate run on push to main
# only (never on PRs — saves the musl/PGO image build per PR).
# release: multi-arch image push to GHCR on push to main (`latest`) and on
# `v*` tags (dedicated version tag + `latest`), after gate. Registry pushes
# happen automatically on these events by standing user instruction.
name: ci

on:
  pull_request:
  push:
    branches: ["main"]
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE_RELEASE: ghcr.io/hekpyto/shahmat
  IMAGE_LOCAL: shahmat-svc:ci
  PERFT_D6: "119060324"

jobs:
  gate:
    name: gate (native single-arch)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set SOURCE_DATE_EPOCH from commit time
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      # Sole cache action in this workflow.
      - uses: Swatinem/rust-cache@v2

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --locked --all-targets -- -D warnings

      - name: test (debug)
        run: cargo test --locked -p shahmat

      - name: test (release)
        run: cargo test --locked --release -p shahmat

      - name: build (release)
        run: cargo build --locked --release

      # Host perft cross-check: bulk-ON startpos d6 must print the exact count.
      - name: perft startpos d6 exact (host)
        run: |
          set -euo pipefail
          cargo run --locked --release --bin shahmat-svc -- perft startpos 6 | tee perft-d6.log
          grep -q "nodes: ${PERFT_D6}" perft-d6.log

      # Docker image steps run on push to main only (not on PRs or tags).
      - name: docker build (local, no push)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker build -t "${IMAGE_LOCAL}" .

      # In-image smoke: exec health-check must exit 0 (compose uses the same path).
      - name: smoke (/svc --health-check in-image)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: docker run --rm --entrypoint /svc "${IMAGE_LOCAL}" --health-check

      - name: image size (warn >12MB, fail >50MB)
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          set -euo pipefail
          BYTES="$(docker image inspect "${IMAGE_LOCAL}" --format='{{.Size}}')"
          MB="$(awk -v b="$BYTES" 'BEGIN {printf "%.1f", b/1048576}')"
          echo "image=${IMAGE_LOCAL} bytes=${BYTES} (~${MB}MB)"
          if [ "$BYTES" -gt 52428800 ]; then
            echo "::error::image exceeds 50MB (${MB}MB)"
            exit 1
          fi
          if [ "$BYTES" -gt 12582912 ]; then
            echo "::warning::image exceeds expected 12MB (${MB}MB)"
          fi
  release:
    name: 'release (multi-arch push: latest + version tag)'
    needs: [gate]
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7

      - name: Set SOURCE_DATE_EPOCH from commit time
        run: |
          set -euo pipefail
          echo "SOURCE_DATE_EPOCH=$(git log -1 --format=%ct)" >> "$GITHUB_ENV"
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags: `latest` on every release run, plus the version tag on `v*`
      # pushes. Literal lowercase image path (GHCR rejects uppercase).
      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/hekpyto/shahmat
          tags: |
            type=raw,value=latest
            type=ref,event=tag

      - name: buildx build + push (amd64, arm64; provenance max + SBOM)
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          provenance: mode=max
          sbom: true
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
      # Per-arch tags: point at each arch digest inside the pushed index.
      # No rebuild — imagetools only. The `latest` index stays the pull path.
      - name: create per-arch tags (amd64/arm64)
        run: |
          set -euo pipefail
          TAG="${IMAGE_RELEASE}:latest"
          RAW="$(docker buildx imagetools inspect "$TAG" --raw)"
          AMD="$(echo "$RAW" | jq -r '.manifests[] | select(.platform.architecture=="amd64") | .digest')"
          ARM="$(echo "$RAW" | jq -r '.manifests[] | select(.platform.architecture=="arm64") | .digest')"
          [ -n "$AMD" ] && [ -n "$ARM" ] || { echo "::error::missing arch digest in index" >&2; exit 1; }
          docker buildx imagetools create -t "${IMAGE_RELEASE}:amd64-latest" "${IMAGE_RELEASE}@${AMD}"
          docker buildx imagetools create -t "${IMAGE_RELEASE}:arm64-latest" "${IMAGE_RELEASE}@${ARM}"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VER="${GITHUB_REF#refs/tags/}"
            docker buildx imagetools create -t "${IMAGE_RELEASE}:amd64-${VER}" "${IMAGE_RELEASE}@${AMD}"
            docker buildx imagetools create -t "${IMAGE_RELEASE}:arm64-${VER}" "${IMAGE_RELEASE}@${ARM}"
          fi

      - name: record per-arch size (warn >12MB, fail >50MB)
        run: |
          set -euo pipefail
          TAG="${IMAGE_RELEASE}:latest"
          RAW="$(docker buildx imagetools inspect "$TAG" --raw)"
          FAIL=0
          while read -r ARCH SIZE; do
            MB="$(awk -v b="$SIZE" 'BEGIN {printf "%.1f", b/1048576}')"
            echo "arch=${ARCH} bytes=${SIZE} (~${MB}MB)"
            if [ "$SIZE" -gt 52428800 ]; then
              echo "::error::${ARCH} image exceeds 50MB (${MB}MB)"
              FAIL=1
            elif [ "$SIZE" -gt 12582912 ]; then
              echo "::warning::${ARCH} image exceeds expected 12MB (${MB}MB)"
            fi
          done <<<"$(echo "$RAW" | jq -r '.manifests[] | "\(.platform.architecture) \(.size)"')"
          exit "$FAIL"
